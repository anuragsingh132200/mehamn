[project]
name = "mehman-mira"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "psycopg[binary,pool]>=3.2,<4", "alembic>=1.14,<2", "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4", "openai>=2,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "freezegun>=1.5,<2", "locust>=2.32,<3"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
